<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — FerreSystem</title>
<style>
  :root {
    --color-primario: #e74c3c;
    --color-secundario: #2c3e50;
    --bg: #f5f6fa;
    --bg-white: #ffffff;
    --border: #e2e5ec;
    --text: #1a1d27;
    --text-muted: #6b7280;
    --radius: 10px;
    --font: 'Segoe UI', system-ui, sans-serif;
    --ok: #10b981;
    --warn: #f59e0b;
    --error: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  /* NAV */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 58px;
    background: var(--bg-white); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: var(--text); text-decoration: none; }
  .nav-logo-dot {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--color-primario); display: flex; align-items: center;
    justify-content: center; font-weight: 900; color: #fff;
  }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-search {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 16px; font-size: 0.85rem;
    color: var(--text); outline: none; width: 220px;
  }
  .nav-search:focus { border-color: var(--color-primario); }
  .cart-btn {
    position: relative; background: var(--color-primario); color: #fff;
    border: none; border-radius: 8px; padding: 7px 16px;
    cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;
  }
  .cart-count {
    background: #fff; color: var(--color-primario);
    border-radius: 10px; padding: 1px 6px; font-size: 0.7rem; font-weight: 800;
    display: none;
  }
  .cart-count.visible { display: inline; }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, var(--color-secundario) 0%, #1a252f 100%);
    color: #fff; padding: 36px 32px; text-align: center;
  }
  .hero h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
  .hero p { color: rgba(255,255,255,0.7); font-size: 0.9rem; }

  /* FILTROS */
  .filtros {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 16px 28px; background: var(--bg-white); border-bottom: 1px solid var(--border);
  }
  .filtro-btn {
    background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 20px; padding: 5px 14px; font-size: 0.82rem; cursor: pointer;
    transition: all 0.15s;
  }
  .filtro-btn:hover, .filtro-btn.active {
    background: var(--color-primario); border-color: var(--color-primario); color: #fff;
  }
  .filtro-stock {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 0.82rem; color: var(--text-muted); cursor: pointer;
  }
  input[type=checkbox] { accent-color: var(--color-primario); }

  /* GRID */
  .catalogo { padding: 24px 28px; }
  .catalogo-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .catalogo-count { font-size: 0.85rem; color: var(--text-muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .prod-card {
    background: var(--bg-white); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: box-shadow 0.15s, transform 0.15s;
    cursor: default;
  }
  .prod-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); }
  .prod-card.sin-stock { opacity: 0.55; }
  .prod-img {
    height: 120px; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.8rem; border-bottom: 1px solid var(--border);
    position: relative;
  }
  .stock-badge {
    position: absolute; top: 8px; right: 8px;
    font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 10px;
  }
  .stock-badge.ok    { background: #d1fae5; color: #065f46; }
  .stock-badge.bajo  { background: #fef3c7; color: #92400e; }
  .stock-badge.agotado { background: #fee2e2; color: #991b1b; }
  .prod-body { padding: 12px 14px; }
  .prod-cat { font-size: 0.68rem; text-transform: uppercase; color: var(--color-primario); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; }
  .prod-nombre { font-weight: 600; font-size: 0.88rem; line-height: 1.3; margin-bottom: 4px; }
  .prod-sku { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 10px; }
  .prod-footer { display: flex; align-items: center; justify-content: space-between; }
  .prod-precio { font-size: 1.05rem; font-weight: 800; color: var(--text); }
  .prod-precio.oculto { color: transparent; user-select: none; font-size: 0.75rem; background: var(--border); border-radius: 4px; padding: 2px 8px; }
  .btn-agregar {
    background: var(--color-primario); color: #fff; border: none;
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 0.78rem; font-weight: 600;
  }
  .btn-agregar:hover { opacity: 0.85; }
  .btn-agregar:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  /* COTIZADOR LATERAL */
  .cotiz-panel {
    position: fixed; right: -380px; top: 0; width: 380px; height: 100vh;
    background: var(--bg-white); border-left: 1px solid var(--border);
    box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    transition: right 0.3s ease; z-index: 200; display: flex; flex-direction: column;
  }
  .cotiz-panel.open { right: 0; }
  .cotiz-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .cotiz-titulo { font-weight: 700; font-size: 1rem; }
  .btn-cerrar-cotiz { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); }
  .cotiz-items { flex: 1; overflow-y: auto; padding: 12px 0; }
  .cotiz-item {
    display: flex; gap: 10px; padding: 10px 20px;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  .cotiz-item-nombre { flex: 1; font-size: 0.85rem; font-weight: 500; }
  .cotiz-item-sku { font-size: 0.72rem; color: var(--text-muted); }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .qty-btn { background: var(--bg); border: 1px solid var(--border); width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
  .qty-val { font-weight: 600; font-size: 0.85rem; min-width: 20px; text-align: center; }
  .cotiz-item-precio { font-weight: 700; font-size: 0.9rem; min-width: 80px; text-align: right; }
  .btn-quitar { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 2px; }
  .cotiz-footer { padding: 16px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .cotiz-resumen-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; }
  .cotiz-total { font-weight: 800; font-size: 1.05rem; color: var(--color-primario); }
  .btn-solicitar {
    display: block; width: 100%; padding: 12px; border-radius: 8px;
    background: var(--color-primario); color: #fff; border: none;
    font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 12px;
  }
  .btn-solicitar:hover { opacity: 0.9; }
  .cotiz-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.85rem; }

  /* MÓDULO DESACTIVADO */
  .modulo-off {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 40vh; text-align: center; color: var(--text-muted); padding: 40px;
  }
  .modulo-off .icon { font-size: 3rem; margin-bottom: 12px; }
  .modulo-off h3 { font-size: 1.1rem; color: var(--text); margin-bottom: 6px; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
    .cotiz-panel { width: 100%; right: -100%; }
    .nav-search { width: 130px; }
  }

  /* ANIMATIONS */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .prod-card {
    animation: rise .5s cubic-bezier(.22,1,.36,1) both;
  }
  /* Stagger first 12 cards; beyond that instant */
  .grid .prod-card:nth-child(1)  { animation-delay: .02s; }
  .grid .prod-card:nth-child(2)  { animation-delay: .06s; }
  .grid .prod-card:nth-child(3)  { animation-delay: .10s; }
  .grid .prod-card:nth-child(4)  { animation-delay: .14s; }
  .grid .prod-card:nth-child(5)  { animation-delay: .18s; }
  .grid .prod-card:nth-child(6)  { animation-delay: .22s; }
  .grid .prod-card:nth-child(7)  { animation-delay: .26s; }
  .grid .prod-card:nth-child(8)  { animation-delay: .30s; }
  .grid .prod-card:nth-child(9)  { animation-delay: .34s; }
  .grid .prod-card:nth-child(10) { animation-delay: .38s; }
  .grid .prod-card:nth-child(11) { animation-delay: .42s; }
  .grid .prod-card:nth-child(12) { animation-delay: .46s; }

  @media (prefers-reduced-motion: reduce) {
    .prod-card { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="#">
    <div class="nav-logo-dot" id="nav-inicial">F</div>
    <span id="nav-nombre">Catálogo</span>
  </a>
  <div class="nav-right">
    <input class="nav-search" type="text" placeholder="Buscar producto…" oninput="filtrar()" id="search-input">
    <button class="cart-btn" id="cart-btn" onclick="toggleCotiz()" style="display:none">
      🛒 Cotización
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </div>
</nav>

<div class="hero">
  <h1 id="hero-titulo">Catálogo de productos</h1>
  <p id="hero-sub">Stock en tiempo real · Precios actualizados</p>
</div>

<div class="filtros" id="filtros-section">
  <button class="filtro-btn active" onclick="filtrarCat('', this)">Todos</button>
  <div id="filtros-cat"></div>
  <label class="filtro-stock">
    <input type="checkbox" id="solo-stock" onchange="filtrar()"> Solo con stock
  </label>
</div>

<div class="catalogo" id="catalogo-section">
  <div class="catalogo-header">
    <span class="catalogo-count" id="catalogo-count"></span>
  </div>
  <div class="grid" id="grid-productos"></div>
</div>

<!-- Cotizador lateral (módulo opcional) -->
<div class="cotiz-panel" id="cotiz-panel">
  <div class="cotiz-header">
    <span class="cotiz-titulo">Mi cotización</span>
    <button class="btn-cerrar-cotiz" onclick="toggleCotiz()">✕</button>
  </div>
  <div class="cotiz-items" id="cotiz-items"></div>
  <div class="cotiz-footer">
    <div class="cotiz-resumen-row"><span>Subtotal neto</span><span id="cot-subtotal">$0</span></div>
    <div class="cotiz-resumen-row"><span>IVA (19%)</span><span id="cot-iva">$0</span></div>
    <div class="cotiz-resumen-row cotiz-total"><span>Total</span><span id="cot-total">$0</span></div>
    <button class="btn-solicitar" onclick="solicitarCotiz()">Solicitar cotización por WhatsApp</button>
  </div>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// En producción se inyecta desde tenants/{id}.json + branding/{id}/branding.json
const TENANT_CONFIG = {
  nombre_corto:      "Demo",
  color_primario:    "#e74c3c",
  color_secundario:  "#2c3e50",
  mostrar_precio:    true,   // false = precios ocultos (solo "Consultar")
  whatsapp:          "+56912345678",
  modulos_activos: {
    cotizador:      true,   // false = sin carrito ni botón "Agregar"
    panel_cliente:  true,
  },
};

// Datos demo — en producción desde data/{tenant_id}/{token}/productos.json + stock.json
const PRODUCTOS = [
  { sku:"TOR-001", nombre:"Tornillo 6x1\" C/Plana Zincado x100", cat:"Tornillería", stock:3,  precio:1490,  emoji:"🔩" },
  { sku:"TOR-002", nombre:"Perno Hex M8x50 Galvanizado",          cat:"Tornillería", stock:45, precio:290,   emoji:"🔩" },
  { sku:"TOR-003", nombre:"Tuerca M8 Galvanizada x50",            cat:"Tornillería", stock:0,  precio:890,   emoji:"🔩" },
  { sku:"TOR-004", nombre:"Clavo Punta París 3\" x1kg",           cat:"Tornillería", stock:88, precio:1990,  emoji:"🔩" },
  { sku:"HER-001", nombre:"Destornillador Plano 6\"",             cat:"Herramientas",stock:12, precio:3990,  emoji:"🔧" },
  { sku:"HER-002", nombre:"Martillo Carpintero 500g",             cat:"Herramientas",stock:1,  precio:8490,  emoji:"🔨" },
  { sku:"HER-003", nombre:"Llave Combinada 13mm",                 cat:"Herramientas",stock:7,  precio:4290,  emoji:"🔧" },
  { sku:"HER-004", nombre:"Sierra Caladora Black+Decker",         cat:"Herramientas",stock:2,  precio:54990, emoji:"⚙️" },
  { sku:"ELE-001", nombre:"Cable THHN 2.5mm Rojo x100m",          cat:"Electricidad",stock:4,  precio:89900, emoji:"⚡" },
  { sku:"ELE-002", nombre:"Interruptor Simple Legrand",           cat:"Electricidad",stock:18, precio:4990,  emoji:"💡" },
  { sku:"ELE-003", nombre:"Enchufe Triple c/tierra",              cat:"Electricidad",stock:9,  precio:2990,  emoji:"🔌" },
  { sku:"PLO-001", nombre:"Codo PVC 110mm 90°",                   cat:"Plomería",    stock:6,  precio:1890,  emoji:"🚿" },
  { sku:"PLO-002", nombre:"Llave de Paso 1/2\" Bronce",           cat:"Plomería",    stock:0,  precio:7990,  emoji:"🚿" },
  { sku:"PIN-001", nombre:"Pintura Látex Blanco 4L",              cat:"Pintura",     stock:0,  precio:15990, emoji:"🎨" },
  { sku:"PIN-002", nombre:"Rodillo Antigota 23cm",                cat:"Pintura",     stock:11, precio:3290,  emoji:"🖌️" },
];

// ─── FEATURE FLAGS ────────────────────────────────────────────────────────────
const COTIZADOR_ON = TENANT_CONFIG.modulos_activos?.cotizador !== false;
const MOSTRAR_PRECIO = TENANT_CONFIG.mostrar_precio !== false;

// ─── ESTADO ──────────────────────────────────────────────────────────────────
let categoriaActual = '';
let carrito = [];

// ─── BRANDING ────────────────────────────────────────────────────────────────
function aplicarBranding() {
  const cfg = TENANT_CONFIG;
  document.documentElement.style.setProperty('--color-primario',    cfg.color_primario    || '#e74c3c');
  document.documentElement.style.setProperty('--color-secundario',  cfg.color_secundario  || '#2c3e50');
  const inicial = (cfg.nombre_corto || 'F')[0].toUpperCase();
  document.getElementById('nav-inicial').textContent = inicial;
  document.getElementById('nav-nombre').textContent = cfg.nombre_corto || 'Catálogo';
  document.getElementById('hero-titulo').textContent = `Catálogo — ${cfg.nombre_corto || ''}`;
  document.title = `Catálogo — ${cfg.nombre_corto || 'FerreSystem'}`;
  if (COTIZADOR_ON) document.getElementById('cart-btn').style.display = 'flex';
}

// ─── FILTROS ─────────────────────────────────────────────────────────────────
function renderFiltrosCat() {
  const cats = [...new Set(PRODUCTOS.map(p => p.cat))];
  document.getElementById('filtros-cat').innerHTML = cats.map(c =>
    `<button class="filtro-btn" onclick="filtrarCat('${c}', this)">${c}</button>`
  ).join('');
}

function filtrarCat(cat, el) {
  categoriaActual = cat;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  filtrar();
}

function filtrar() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const soloStock = document.getElementById('solo-stock').checked;
  const filtrados = PRODUCTOS.filter(p => {
    if (categoriaActual && p.cat !== categoriaActual) return false;
    if (soloStock && p.stock === 0) return false;
    if (q && !p.nombre.toLowerCase().includes(q) && !p.sku.toLowerCase().includes(q)) return false;
    return true;
  });
  renderGrid(filtrados);
  document.getElementById('catalogo-count').textContent = `${filtrados.length} producto${filtrados.length !== 1 ? 's' : ''}`;
}

// ─── GRID ─────────────────────────────────────────────────────────────────────
function stockBadge(p) {
  if (p.stock === 0)  return `<span class="stock-badge agotado">Agotado</span>`;
  if (p.stock <= 3)   return `<span class="stock-badge bajo">Últimas ${p.stock}</span>`;
  return `<span class="stock-badge ok">Disponible</span>`;
}

function fmt(n) { return '$' + Math.round(n).toLocaleString('es-CL'); }

function renderGrid(lista) {
  const grid = document.getElementById('grid-productos');
  if (!lista.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">Sin resultados</div>';
    return;
  }
  grid.innerHTML = lista.map(p => {
    const sinStock = p.stock === 0;
    const precioHtml = MOSTRAR_PRECIO
      ? `<span class="prod-precio">${fmt(p.precio)}</span>`
      : `<span class="prod-precio oculto">Consultar</span>`;
    const btnHtml = COTIZADOR_ON
      ? `<button class="btn-agregar" onclick="agregarCarrito('${p.sku}')" ${sinStock ? 'disabled' : ''}>
           ${sinStock ? 'Agotado' : '+ Agregar'}
         </button>`
      : '';
    return `
      <div class="prod-card ${sinStock ? 'sin-stock' : ''}">
        <div class="prod-img">
          ${p.emoji}
          ${stockBadge(p)}
        </div>
        <div class="prod-body">
          <div class="prod-cat">${p.cat}</div>
          <div class="prod-nombre">${p.nombre}</div>
          <div class="prod-sku">${p.sku}</div>
          <div class="prod-footer">
            ${precioHtml}
            ${btnHtml}
          </div>
        </div>
      </div>`;
  }).join('');
}

// ─── COTIZADOR ────────────────────────────────────────────────────────────────
function agregarCarrito(sku) {
  if (!COTIZADOR_ON) return;
  const prod = PRODUCTOS.find(p => p.sku === sku);
  const existing = carrito.find(c => c.sku === sku);
  if (existing) existing.qty++;
  else carrito.push({ ...prod, qty: 1 });
  renderCarrito();
}

function cambiarQty(sku, delta) {
  const item = carrito.find(c => c.sku === sku);
  if (!item) return;
  item.qty = Math.max(1, item.qty + delta);
  renderCarrito();
}

function quitarItem(sku) {
  carrito = carrito.filter(c => c.sku !== sku);
  renderCarrito();
}

function renderCarrito() {
  const count = document.getElementById('cart-count');
  const total_items = carrito.reduce((s, c) => s + c.qty, 0);
  count.textContent = total_items;
  count.className = 'cart-count' + (total_items > 0 ? ' visible' : '');

  const cont = document.getElementById('cotiz-items');
  if (!carrito.length) {
    cont.innerHTML = '<div class="cotiz-empty">Sin productos<br><small>Agrega productos desde el catálogo</small></div>';
    ['cot-subtotal','cot-iva','cot-total'].forEach(id => document.getElementById(id).textContent = '$0');
    return;
  }

  cont.innerHTML = carrito.map(p => `
    <div class="cotiz-item">
      <div style="flex:1">
        <div class="cotiz-item-nombre">${p.nombre}</div>
        <div class="cotiz-item-sku">${p.sku}</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="cambiarQty('${p.sku}',-1)">−</button>
        <span class="qty-val">${p.qty}</span>
        <button class="qty-btn" onclick="cambiarQty('${p.sku}',1)">+</button>
      </div>
      <div class="cotiz-item-precio">${fmt(p.precio * p.qty)}</div>
      <button class="btn-quitar" onclick="quitarItem('${p.sku}')">✕</button>
    </div>
  `).join('');

  const subtotal = carrito.reduce((s, p) => s + p.precio * p.qty, 0);
  const iva = subtotal * 0.19;
  document.getElementById('cot-subtotal').textContent = fmt(subtotal);
  document.getElementById('cot-iva').textContent      = fmt(iva);
  document.getElementById('cot-total').textContent    = fmt(subtotal + iva);
}

function toggleCotiz() {
  if (!COTIZADOR_ON) return;
  document.getElementById('cotiz-panel').classList.toggle('open');
}

function solicitarCotiz() {
  if (!carrito.length) return;
  const lineas = carrito.map(p => `• ${p.nombre} x${p.qty} = ${fmt(p.precio*p.qty)}`).join('%0A');
  const subtotal = carrito.reduce((s, p) => s + p.precio * p.qty, 0);
  const total = subtotal * 1.19;
  const msg = `Hola! Quisiera cotizar los siguientes productos:%0A${lineas}%0A%0ATotal aprox: ${fmt(total)}`;
  window.open(`https://wa.me/${TENANT_CONFIG.whatsapp}?text=${msg}`, '_blank');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
aplicarBranding();
renderFiltrosCat();
filtrar();
renderCarrito();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
